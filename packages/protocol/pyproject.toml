[project]
name = "sigtrades-protocol"
version = "0.1.0"
description = "sigtrades wire protocol: relay WS messages and internal contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigtrades_protocol*"]
